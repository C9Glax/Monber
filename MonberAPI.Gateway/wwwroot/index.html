<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MonberAPI</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { margin-bottom: 0.25rem; }
  p.sub { color: #666; margin-top: 0; }
  fieldset { margin-bottom: 1.5rem; border-radius: 8px; }
  legend { font-weight: 600; padding: 0 0.4rem; }
  label { display: inline-block; margin-right: 0.75rem; }
  input { width: 8rem; padding: 0.25rem; }
  input[type="text"] { width: 12rem; }
  button { padding: 0.35rem 0.9rem; margin-top: 0.5rem; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 0.75rem; font-size: 0.9rem; }
  th, td { text-align: left; border-bottom: 1px solid #ccc; padding: 0.3rem 0.5rem; }
  .error { color: #c0392b; }
  .status { color: #666; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>MonberAPI</h1>
<p class="sub">Talks to Services.POI and Services.Prices through the YARP gateway.</p>

<fieldset>
  <legend>Location</legend>
  <label>Lat <input id="lat" type="number" step="any" value="52.52" /></label>
  <label>Lon <input id="lon" type="number" step="any" value="13.405" /></label>
  <button id="use-location">Use my location</button>
  <p id="location-status" class="status"></p>
</fieldset>

<fieldset>
  <legend>Nearby stores (POI)</legend>
  <button id="load-poi-stores">Load nearby stores</button>
  <div id="poi-stores-result"></div>
</fieldset>

<fieldset>
  <legend>Tracked price stores</legend>
  <label>Brand <input id="brand" type="text" placeholder="e.g. Kaufland" /></label>
  <button id="load-price-stores">Load stores</button>
  <div id="price-stores-result"></div>
</fieldset>

<fieldset>
  <legend>Prices near location</legend>
  <button id="load-prices-nearby">Load prices</button>
  <div id="prices-nearby-result"></div>
</fieldset>

<fieldset>
  <legend>Prices for a store</legend>
  <label>Store ID <input id="store-id" type="number" /></label>
  <button id="load-prices-store">Load prices</button>
  <div id="prices-store-result"></div>
</fieldset>

<fieldset>
  <legend>Price history</legend>
  <label>Store ID <input id="history-store-id" type="number" /></label>
  <label>Product <input id="history-product" type="text" placeholder="e.g. Monster Energy" /></label>
  <button id="load-history">Load history</button>
  <div id="history-result"></div>
</fieldset>

<script>
async function fetchJson(url) {
  const res = await fetch(url);
  const text = await res.text();
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}: ${text}`);
  return text ? JSON.parse(text) : null;
}

function renderTable(container, rows) {
  if (!rows || rows.length === 0) {
    container.innerHTML = '<p class="status">No results.</p>';
    return;
  }
  const columns = Object.keys(rows[0]);
  const head = columns.map(c => `<th>${c}</th>`).join('');
  const body = rows.map(r => `<tr>${columns.map(c => `<td>${formatValue(r[c])}</td>`).join('')}</tr>`).join('');
  container.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function formatValue(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

function renderError(container, err) {
  container.innerHTML = `<p class="error">${err.message}</p>`;
}

function wire(buttonId, containerId, buildUrl) {
  const button = document.getElementById(buttonId);
  const container = document.getElementById(containerId);
  button.addEventListener('click', async () => {
    container.innerHTML = '<p class="status">Loading…</p>';
    try {
      const data = await fetchJson(buildUrl());
      renderTable(container, Array.isArray(data) ? data : [data]);
    } catch (err) {
      renderError(container, err);
    }
  });
}

const latInput = document.getElementById('lat');
const lonInput = document.getElementById('lon');

document.getElementById('use-location').addEventListener('click', () => {
  const status = document.getElementById('location-status');
  if (!navigator.geolocation) {
    status.textContent = 'Geolocation not supported by this browser.';
    return;
  }
  status.textContent = 'Locating…';
  navigator.geolocation.getCurrentPosition(
    pos => {
      latInput.value = pos.coords.latitude;
      lonInput.value = pos.coords.longitude;
      status.textContent = 'Location updated.';
    },
    err => { status.textContent = `Could not get location: ${err.message}`; }
  );
});

wire('load-poi-stores', 'poi-stores-result',
  () => `/poi/stores?lat=${encodeURIComponent(latInput.value)}&lon=${encodeURIComponent(lonInput.value)}`);

wire('load-price-stores', 'price-stores-result', () => {
  const brand = document.getElementById('brand').value.trim();
  return `/prices/stores${brand ? `?brand=${encodeURIComponent(brand)}` : ''}`;
});

wire('load-prices-nearby', 'prices-nearby-result',
  () => `/prices?lat=${encodeURIComponent(latInput.value)}&lon=${encodeURIComponent(lonInput.value)}`);

wire('load-prices-store', 'prices-store-result',
  () => `/prices/store?storeId=${encodeURIComponent(document.getElementById('store-id').value)}`);

wire('load-history', 'history-result', () => {
  const storeId = document.getElementById('history-store-id').value;
  const product = document.getElementById('history-product').value;
  return `/prices/history?storeId=${encodeURIComponent(storeId)}&product=${encodeURIComponent(product)}`;
});
</script>
</body>
</html>
