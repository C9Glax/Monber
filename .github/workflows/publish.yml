name: Publish images and compose

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  REPOSITORY: c9glax

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The three .NET services are containerized via the .NET SDK's built-in container support
      # (dotnet publish /t:PublishContainer) - no Dockerfile needed for these.
      - name: Build and push Services.POI image
        run: >
          dotnet publish Services.POI/Services.POI.csproj -c Release
          -p:PublishProfile=DefaultContainer
          -p:ContainerRegistry=${{ env.REGISTRY }}
          -p:ContainerRepository=${{ env.REPOSITORY }}/monber-services-poi
          -p:ContainerImageTag=${{ github.sha }}

      - name: Build and push Services.Prices image
        run: >
          dotnet publish Services.Prices/Services.Prices.csproj -c Release
          -p:PublishProfile=DefaultContainer
          -p:ContainerRegistry=${{ env.REGISTRY }}
          -p:ContainerRepository=${{ env.REPOSITORY }}/monber-services-prices
          -p:ContainerImageTag=${{ github.sha }}

      - name: Build and push Gateway image
        run: >
          dotnet publish MonberAPI.Gateway/MonberAPI.Gateway.csproj -c Release
          -p:PublishProfile=DefaultContainer
          -p:ContainerRegistry=${{ env.REGISTRY }}
          -p:ContainerRepository=${{ env.REPOSITORY }}/monber-gateway
          -p:ContainerImageTag=${{ github.sha }}

      # SDK container support's ContainerImageTags MSBuild property doesn't take a semicolon-
      # delimited list cleanly from the command line (its validation rejects the raw ;-joined
      # string before splitting it), so each service above is only pushed under its sha tag. Alias
      # "latest" to it with a registry-side manifest copy instead of a second build.
      - name: Tag .NET service images as latest
        run: |
          for image in monber-services-poi monber-services-prices monber-gateway; do
            docker buildx imagetools create \
              -t ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/$image:latest \
              ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/$image:${{ github.sha }}
          done

      # The Nuxt frontend has its own Dockerfile (frontend/Dockerfile) since it isn't a .NET
      # project and can't use SDK container support.
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/monber-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/monber-frontend:latest

      - name: Install Aspire CLI
        run: curl -sSL https://aspire.dev/install.sh | bash -s -- --version 13.4.6

      # `aspire publish` lays out deploy/docker-compose.yaml with ${..._IMAGE}/${..._PORT}
      # placeholders for every "requires image build" resource - it doesn't build or push anything
      # itself. Only GATEWAY_PORT is meant to stay a runtime-configurable env var (it's the only
      # port actually exposed to the host); every other placeholder is baked into the compose file
      # with a literal value below so deploy/.env only needs GATEWAY_PORT and MAPTILER_API_KEY.
      - name: Generate docker-compose.yaml
        run: aspire publish --project MonberAPI.AppHost -o deploy --non-interactive

      # The MapTiler key isn't a secret - it's a public key restricted by allowed HTTP
      # Origin/Referer on MapTiler's side (see https://cloud.maptiler.com/account/), which the
      # browser sets automatically from the page's real URL. It's still kept as a deploy/.env
      # variable (rather than baked into the compose file like the image tags) so it can be
      # configured per-deployment without rebuilding/republishing the compose file. Configure it as
      # a repo *variable* (Settings > Secrets and variables > Actions > Variables), not a secret;
      # falls back to plain OSM tiles if unset, same as local dev.
      # `aspire publish` emits the gateway's host port mapping as the Compose short-syntax single
      # value `- "${GATEWAY_PORT}"`, which Compose treats as "publish this container port to a
      # random host port" (no host part given) rather than a fixed host:container mapping. Rewrite
      # it to "${GATEWAY_PORT}:${GATEWAY_PORT}" so the host port set in deploy/.env is actually
      # honored.
      - name: Bake image tags and internal ports into docker-compose.yaml
        run: |
          sed -i \
            -e "s|\${SERVICES_POI_IMAGE}|${{ env.REGISTRY }}/${{ env.REPOSITORY }}/monber-services-poi:${{ github.sha }}|g" \
            -e "s|\${SERVICES_POI_PORT}|8080|g" \
            -e "s|\${SERVICES_PRICES_IMAGE}|${{ env.REGISTRY }}/${{ env.REPOSITORY }}/monber-services-prices:${{ github.sha }}|g" \
            -e "s|\${SERVICES_PRICES_PORT}|8080|g" \
            -e "s|\${GATEWAY_IMAGE}|${{ env.REGISTRY }}/${{ env.REPOSITORY }}/monber-gateway:${{ github.sha }}|g" \
            -e "s|\${FRONTEND_IMAGE}|${{ env.REGISTRY }}/${{ env.REPOSITORY }}/monber-frontend:${{ github.sha }}|g" \
            -e 's|NUXT_PUBLIC_MAP_TILER_KEY: ""|NUXT_PUBLIC_MAP_TILER_KEY: "${MAPTILER_API_KEY}"|' \
            -e 's|- "\${GATEWAY_PORT}"|- "${GATEWAY_PORT}:${GATEWAY_PORT}"|' \
            deploy/docker-compose.yaml

          cat > deploy/.env <<EOF
          GATEWAY_PORT=8080
          MAPTILER_API_KEY=${{ vars.MAPTILER_API_KEY }}
          EOF

      - name: Commit deploy/ back to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate docker-compose.yaml [skip ci]"
          file_pattern: deploy/*

      - name: Set release tag
        run: echo "RELEASE_TAG=deploy-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      # Draft release so deploy/docker-compose.yaml + deploy/.env are downloadable without cloning
      # the repo. Tagged with a build timestamp (rather than a rolling "latest") so each run
      # produces its own release instead of overwriting a shared tag. Kept as a draft deliberately
      # - it only becomes visible/public once someone publishes it manually from the Releases tab.
      - name: Draft release with deploy assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          draft: true
          files: |
            deploy/docker-compose.yaml
            deploy/.env
